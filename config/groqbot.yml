# Groq-only model route: qwen/qwen3.8-27b
- id: llm-pi-ai
  config:
    providers:
      groq:
        apiKeyEnv: GROQ_API_KEY
        api: openai-completions
        baseURL: https://api.groq.com/openai/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        # Free tier = ~7k input tokens/min: wait out the window instead of failing.
        retryPolicy:
          mode: normal
          maxRetries: 6
          backoff:
            initialDelayMs: 2000
            maxDelayMs: 65000
        models:
          - id: qwen/qwen3.8-27b
            contextWindow: 131072
            maxTokens: 1500
- id: agent-default-model
  config:
    provider: groq
    model: qwen/qwen3.8-27b
- id: agent-preset-registry
  config:
    default: groqbot
# Skip the extra LLM call that titles each new session (saves Groq TPM).
- id: session-title-llm
  disabled: true
- insert:
    - id: preset-groqbot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: groqbot
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{groqbot_prompt}}'
              complete: true
              includeRuntimeContext: false
          - id: groqbot-tools
            name: '__ROOT__/plugins/groqbot-tools.mjs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: chat-bridge
      name: '__ROOT__/plugins/chat-bridge.mjs'
