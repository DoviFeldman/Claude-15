# Model routes and the default model come from data/models.json (scripts/models-patch.mjs).
- id: agent-preset-registry
  config:
    default: groqbot
# Skip the extra LLM call that titles each new session (saves Groq TPM).
- id: session-title-llm
  disabled: true
- insert:
    - id: preset-groqbot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: groqbot
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{groqbot_prompt}}'
              complete: true
              includeRuntimeContext: false
          - id: groqbot-tools
            name: '__ROOT__/plugins/groqbot-tools.mjs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: chat-bridge
      name: '__ROOT__/plugins/chat-bridge.mjs'
